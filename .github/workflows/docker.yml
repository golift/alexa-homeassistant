name: docker

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  # Pull requests always run. A path filter would omit the cert-rotator
  # status, and the ruleset treats a missing required check as not passed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cert-rotator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Same paths as the push trigger. A skipped job would not satisfy the
      # required check, so this job stays green and does no build instead.
      - name: Skip when the image inputs did not change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(docker/|\.github/workflows/docker\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No docker changes. Leaving cert-rotator green without building."
          fi

      # Pinned: the runner's bundled shellcheck drifts from what developers run
      # locally, and the two disagree about which findings are worth failing on.
      - name: Lint the entrypoint
        if: steps.scope.outputs.run == 'true'
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 docker/rotate.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.run == 'true'

      - name: Log in to GHCR
        if: steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.scope.outputs.run == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/cert-rotator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Pull requests build both architectures but publish nothing.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.scope.outputs.run == 'true'
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
