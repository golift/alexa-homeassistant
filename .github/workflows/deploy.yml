name: deploy

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Home Assistant public URL (https://ha.example.com)
        required: true
      skill_id:
        description: Alexa Skill ID (leave empty on first deploy)
        required: false
        default: ""
      mtls_param_name:
        description: Existing SSM parameter name for mTLS cert (optional)
        required: false
        default: ""
      log_retention_days:
        description: CloudWatch log retention in days
        required: false
        default: "90"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"  # match the Lambda runtime in cfn/template.yaml

      - name: Package Lambda
        working-directory: lambda
        run: zip -r ../lambda.zip . -x 'requirements.txt' '*__pycache__*' '*.pyc'

      - name: Upload artifact
        run: aws s3 cp lambda.zip s3://${{ secrets.ARTIFACT_BUCKET }}/alexa-ha/lambda.zip

      - name: CloudFormation deploy
        run: |
          aws cloudformation deploy \
            --template-file cfn/template.yaml \
            --stack-name alexa-ha-smarthome \
            --region ${{ vars.AWS_REGION || 'us-east-1' }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              BaseUrl=${{ inputs.base_url }} \
              AlexaSkillId=${{ inputs.skill_id }} \
              LogRetentionDays=${{ inputs.log_retention_days }} \
              MtlsParamName=${{ inputs.mtls_param_name }} \
              CodeS3Bucket=${{ secrets.ARTIFACT_BUCKET }} \
              CodeS3Key=alexa-ha/lambda.zip
