AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::LanguageExtensions
Description: >-
  Alexa Smart Home → Home Assistant over HTTPS, with optional mTLS at your
  reverse proxy (nginx). Lambda proxies Alexa directives to
  {BaseUrl}/api/alexa/smart_home. Deploy in the region your Alexa skill
  requires (us-east-1 for North America).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Alexa / Home Assistant"
        Parameters:
          - BaseUrl
          - AlexaSkillId
      - Label:
          default: "Lambda code (S3)"
        Parameters:
          - CodeS3Bucket
          - CodeS3Key
      - Label:
          default: "mTLS (optional)"
        Parameters:
          - MtlsSecretArn
          - CreateMtlsSecret
          - ClientCrt
          - ClientKey
    ParameterLabels:
      BaseUrl:
        default: "Home Assistant public URL"
      AlexaSkillId:
        default: "Alexa Skill ID"
      MtlsSecretArn:
        default: "Existing Secrets Manager ARN"
      CreateMtlsSecret:
        default: "Create secret from inline PEM?"
      ClientCrt:
        default: "Client certificate PEM"
      ClientKey:
        default: "Client private key PEM"

Parameters:
  BaseUrl:
    Type: String
    Description: >-
      Public HTTPS URL of Home Assistant, no trailing slash. Example:
      https://ha.example.com
    AllowedPattern: ^https://[^/]+$
    ConstraintDescription: Must start with https:// and not contain a path.

  AlexaSkillId:
    Type: String
    Default: ""
    Description: >-
      amzn1.ask.skill.xxxxxxxx from the Alexa Developer Console. Leave empty on
      first deploy (skill not created yet); redeploy with the ID later to lock
      the Lambda permission to your skill only.

  CodeS3Bucket:
    Type: String
    Description: S3 bucket containing the packaged Lambda zip.
  CodeS3Key:
    Type: String
    Description: S3 key of the packaged Lambda zip.

  MtlsSecretArn:
    Type: String
    Default: ""
    Description: >-
      Optional. ARN of an existing Secrets Manager secret containing JSON:
      {"client_crt": "PEM...", "client_key": "PEM..."}. Overrides CreateMtlsSecret.

  CreateMtlsSecret:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      If true, create a Secrets Manager secret from ClientCrt/ClientKey
      parameters below. Prefer CLI upload (docs/alexa-setup.md) so keys are
      not stored in CloudFormation parameters.

  ClientCrt:
    Type: String
    Default: ""
    NoEcho: true
    Description: "PEM client certificate (only when CreateMtlsSecret=true)."

  ClientKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "PEM client private key (only when CreateMtlsSecret=true)."

Conditions:
  HasSkillId: !Not [!Equals [!Ref AlexaSkillId, ""]]
  HasMtlsSecret: !Not [!Equals [!Ref MtlsSecretArn, ""]]
  ShouldCreateSecret: !And
    - !Equals [!Ref CreateMtlsSecret, "true"]
    - !Not [!Condition HasMtlsSecret]
  UseMtls: !Or [!Condition HasMtlsSecret, !Condition ShouldCreateSecret]

Resources:
  MtlsSecret:
    Type: AWS::SecretsManager::Secret
    Condition: ShouldCreateSecret
    Properties:
      # Derived from the stack name: a fixed name breaks re-deploys (deleted
      # secrets hold their name for the recovery window) and parallel stacks.
      Name: !Sub "${AWS::StackName}-mtls-client"
      Description: mTLS client certificate/key for Alexa Lambda → Home Assistant
      # ToJsonString handles PEM newlines; a plain !Sub would emit broken JSON.
      SecretString: !ToJsonString
        client_crt: !Ref ClientCrt
        client_key: !Ref ClientKey

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      # No RoleName: let CloudFormation generate one so re-deploys and
      # parallel stacks don't collide on a fixed role name.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  SecretReadPolicy:
    Type: AWS::IAM::Policy
    Condition: UseMtls
    Properties:
      PolicyName: read-mtls-secret
      Roles:
        - !Ref LambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !If [HasMtlsSecret, !Ref MtlsSecretArn, !Ref MtlsSecret]

  SmartHomeFunction:
    Type: AWS::Lambda::Function
    Properties:
      # No FunctionName: CloudFormation derives one from the stack name, so
      # multiple stacks in one account/region don't collide.
      Description: Alexa Smart Home → Home Assistant (optional mTLS)
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: lambda_function.lambda_handler
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables: !If
          - UseMtls
          - BASE_URL: !Ref BaseUrl
            MTLS_CERT_SECRET: !If [HasMtlsSecret, !Ref MtlsSecretArn, !Ref MtlsSecret]
          - BASE_URL: !Ref BaseUrl

  AlexaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SmartHomeFunction
      Action: lambda:InvokeFunction
      Principal: alexa-connectedhome.amazon.com
      EventSourceToken: !If [HasSkillId, !Ref AlexaSkillId, !Ref AWS::NoValue]

Outputs:
  LambdaArn:
    Description: Paste into Alexa Developer Console → Smart Home endpoint
    Value: !GetAtt SmartHomeFunction.Arn
  FunctionName:
    Value: !Ref SmartHomeFunction
  MtlsSecretArnOut:
    Condition: UseMtls
    Value: !If [HasMtlsSecret, !Ref MtlsSecretArn, !Ref MtlsSecret]
