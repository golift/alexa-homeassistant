AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::LanguageExtensions
Description: >-
  Alexa Smart Home → Home Assistant over HTTPS, with optional mTLS at your
  reverse proxy (nginx). Lambda proxies Alexa directives to
  {BaseUrl}/api/alexa/smart_home. Deploy in the region your Alexa skill
  requires (us-east-1 for North America).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Alexa / Home Assistant"
        Parameters:
          - BaseUrl
          - AlexaSkillId
          - LogRetentionDays
      - Label:
          default: "Lambda code (S3)"
        Parameters:
          - CodeS3Bucket
          - CodeS3Key
      - Label:
          default: "mTLS (optional)"
        Parameters:
          - MtlsParamName
          - CreateMtlsParam
          - ClientCrt
          - ClientKey
    ParameterLabels:
      BaseUrl:
        default: "Home Assistant public URL"
      AlexaSkillId:
        default: "Alexa Skill ID"
      LogRetentionDays:
        default: "CloudWatch log retention"
      MtlsParamName:
        default: "Existing SSM parameter name"
      CreateMtlsParam:
        default: "Create param from inline PEM?"
      ClientCrt:
        default: "Client certificate PEM"
      ClientKey:
        default: "Client private key PEM"

Parameters:
  BaseUrl:
    Type: String
    Description: >-
      Public HTTPS URL of Home Assistant, no trailing slash. Example:
      https://ha.example.com
    AllowedPattern: ^https://[^/]+$
    ConstraintDescription: Must start with https:// and not contain a path.

  AlexaSkillId:
    Type: String
    Default: ""
    Description: >-
      amzn1.ask.skill.xxxxxxxx from the Alexa Developer Console. Leave empty on
      first deploy (skill not created yet); redeploy with the ID later to lock
      the Lambda permission to your skill only.

  CodeS3Bucket:
    Type: String
    Description: S3 bucket containing the packaged Lambda zip.
  CodeS3Key:
    Type: String
    Description: S3 key of the packaged Lambda zip.

  LogRetentionDays:
    Type: Number
    Default: 90
    Description: Days to keep Lambda logs in CloudWatch before expiry.

  MtlsParamName:
    Type: String
    Default: ""
    Description: >-
      Optional. Name of an existing SSM SecureString parameter containing JSON:
      {"client_crt": "PEM...", "client_key": "PEM..."}. Overrides CreateMtlsParam.
      Standard tier (4KB) is free and holds a typical client cert+key.

  CreateMtlsParam:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      If true, create the SSM parameter from ClientCrt/ClientKey below. Prefer
      CLI upload (docs/alexa-setup.md) so keys are not stored in CloudFormation
      parameters.

  ClientCrt:
    Type: String
    Default: ""
    NoEcho: true
    Description: "PEM client certificate (only when CreateMtlsParam=true)."

  ClientKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "PEM client private key (only when CreateMtlsParam=true)."

Rules:
  # CreateMtlsParam=true without PEM material would create an empty parameter
  # and break the TLS handshake at runtime; fail at deploy time instead.
  InlinePemRequired:
    RuleCondition: !And
      - !Equals [!Ref CreateMtlsParam, "true"]
      - !Equals [!Ref MtlsParamName, ""]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref ClientCrt, ""]]
          - !Not [!Equals [!Ref ClientKey, ""]]
        AssertDescription: >-
          CreateMtlsParam=true requires both ClientCrt and ClientKey
          (or pass an existing MtlsParamName instead).

Conditions:
  HasSkillId: !Not [!Equals [!Ref AlexaSkillId, ""]]
  HasMtlsParam: !Not [!Equals [!Ref MtlsParamName, ""]]
  ShouldCreateParam: !And
    - !Equals [!Ref CreateMtlsParam, "true"]
    - !Not [!Condition HasMtlsParam]
  UseMtls: !Or [!Condition HasMtlsParam, !Condition ShouldCreateParam]

Resources:
  MtlsParam:
    Type: AWS::SSM::Parameter
    Condition: ShouldCreateParam
    Properties:
      # Derived from the stack name; parallel stacks get distinct parameters.
      Name: !Sub "/${AWS::StackName}/mtls-client"
      Type: String
      Tier: Standard
      DataType: text
      Description: mTLS client certificate/key JSON for Alexa Lambda → Home Assistant
      # ToJsonString handles PEM newlines; a plain !Sub would emit broken JSON.
      Value: !ToJsonString
        client_crt: !Ref ClientCrt
        client_key: !Ref ClientKey

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      # No RoleName: let CloudFormation generate one so re-deploys and
      # parallel stacks don't collide on a fixed role name.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ParamReadPolicy:
    Type: AWS::IAM::Policy
    Condition: UseMtls
    Properties:
      PolicyName: read-mtls-param
      Roles:
        - !Ref LambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource: !If
              - HasMtlsParam
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MtlsParamName}"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/mtls-client"
          # Uses the default aws/ssm KMS key; no kms:Decrypt needed for it.

  SmartHomeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SmartHomeFunction}"
      RetentionInDays: !Ref LogRetentionDays

  SmartHomeFunction:
    Type: AWS::Lambda::Function
    Properties:
      # No FunctionName: CloudFormation derives one from the stack name, so
      # multiple stacks in one account/region don't collide.
      Description: Alexa Smart Home → Home Assistant (optional mTLS)
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: lambda_function.lambda_handler
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables: !If
          - UseMtls
          - BASE_URL: !Ref BaseUrl
            MTLS_CERT_PARAM: !If [HasMtlsParam, !Ref MtlsParamName, !Ref MtlsParam]
          - BASE_URL: !Ref BaseUrl

  AlexaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SmartHomeFunction
      Action: lambda:InvokeFunction
      Principal: alexa-connectedhome.amazon.com
      EventSourceToken: !If [HasSkillId, !Ref AlexaSkillId, !Ref AWS::NoValue]

Outputs:
  LambdaArn:
    Description: Paste into Alexa Developer Console → Smart Home endpoint
    Value: !GetAtt SmartHomeFunction.Arn
  FunctionName:
    Value: !Ref SmartHomeFunction
  MtlsParamNameOut:
    Condition: UseMtls
    Value: !If [HasMtlsParam, !Ref MtlsParamName, !Ref MtlsParam]
