# Home Assistant behind nginx with optional mTLS for Alexa Smart Home.
#
# Alexa account linking must reach HA WITHOUT a client certificate:
#   GET/POST https://ha.example.com/auth/authorize
#   POST     https://ha.example.com/auth/token
# The Lambda (with client cert) calls:
#   POST     https://ha.example.com/api/alexa/smart_home
#
# nginx cannot enable client-cert verification per-location, so use
# `ssl_verify_client optional` at the server level and enforce SUCCESS
# in the locations you want to protect.
#
# Works on plain nginx or LinuxServer SWAG. Paths assume SWAG (/config/nginx);
# adjust includes for your layout.
#
# Plain nginx only: define this once in the http context (SWAG already has it):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

server {
    listen 443 ssl;
    # For SWAG also: listen [::]:443 ssl;  and use `http2 on;` in newer images.
    server_name ha.example.com;  # use ha.* in SWAG to cover multiple suffixes

    # ---- Server TLS (public cert Alexa/Cloudflare trusts) ----
    # include /config/nginx/ssl.conf;   # SWAG
    ssl_certificate     /config/keys/cert.crt;
    ssl_certificate_key /config/keys/cert.key;

    # ---- mTLS ----
    # CA that signs client certs (e.g. step-ca root or intermediate).
    ssl_client_certificate /config/nginx/pki/home_ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    # Headers Home Assistant needs for correct URLs, client IPs, and
    # websockets. If you use SWAG's proxy.conf (which sets all of these),
    # replace this block with:  include /config/nginx/proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ---- Account linking: PUBLIC (no client cert) ----
    location = /auth/authorize {
        proxy_pass http://homeassistant:8123;
    }
    location = /auth/token {
        proxy_pass http://homeassistant:8123;
    }

    # ---- Alexa Smart Home: REQUIRE client cert ----
    location = /api/alexa/smart_home {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        proxy_pass http://homeassistant:8123;
    }

    # ---- Everything else (UI, API, websockets) ----
    location / {
        # Require mTLS on the public hostname; drop this block if you expose
        # additional local-only names (e.g. ha.home.example.com) without certs.
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        proxy_pass http://homeassistant:8123;
    }
}

# Multiple hostnames on one server (home-direct + LAN without mTLS):
# Use a map and only enforce SUCCESS for the public Cloudflare name.
#
#   map $host $require_mtls {
#       ha.example.com        1;
#       default               0;   # ha.home.example.com, ha.lan.example.com
#   }
#   ...
#   if ($require_mtls = 1) {
#       if ($ssl_client_verify != SUCCESS) { return 403; }
#   }
